name: Integrated privacy workflow validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Check public source boundary before installing dependencies
        run: |
          node --test scripts/check-publication.test.mjs
          node scripts/check-publication.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run prepare:test-fixtures
      - run: npx playwright install --with-deps chromium
      - name: Validate synthetic image workflows and responsive editor
        run: npm run test:integration
        env:
          CI: 'true'
      # Keep screenshots/traces local. CI logs are still public: use fictional input only.
