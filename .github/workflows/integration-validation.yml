name: Integrated privacy workflow validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run prepare:test-fixtures
      - run: npx playwright install --with-deps chromium
      - name: Validate synthetic image workflows and responsive editor
        run: npm run test:integration
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-integration-test-results
          path: test-results/
          retention-days: 7
